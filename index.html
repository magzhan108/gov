<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ресми жаңалықтар порталы</title>
    <meta name="description" content="Мемлекеттік орган — ресми жаңалықтар, хабарламалар, іс-шаралар.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="container top-bar-inner">
            <span class="top-bar-text">Қазақстан Республикасы</span>
            <div class="top-bar-right" id="topBarRight"></div>
        </div>
    </div>

    <!-- Header -->
    <header class="header" id="header">
        <div class="container header-inner">
            <a href="#" class="logo" onclick="navigate('home'); return false;">
                <div class="logo-emblem">
                    <img src="logo.png" alt="Елтаңба логотипі" class="logo-img">
                </div>
                <div class="logo-text">
                    <span class="logo-title">Ресми порталы</span>
                    <span class="logo-subtitle">Жаңалықтар мен хабарламалар</span>
                </div>
            </a>
            <nav class="header-nav" id="headerNav"></nav>
        </div>
    </header>

    <!-- App -->
    <main class="main" id="app"></main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-inner">
            <div class="footer-left">
                <p class="footer-title">Ресми порталы</p>
                <p class="footer-copy">© 2026 Барлық құқықтар қорғалған</p>
            </div>
            <div class="footer-right">
                <p>Байланыс: info@gov.kz</p>
                <p>Телефон: 1414</p>
            </div>
        </div>
    </footer>

    <!-- Toast -->
    <div class="toast-wrap" id="toastWrap"></div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <!-- EmailJS SDK (for sending OTP codes) -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script src="app.js"></script>
</body>
</html>
